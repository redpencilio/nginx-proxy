matrix:
  include:
    - dockerfile: Dockerfile.debian
      tag_suffix: ""
    - dockerfile: Dockerfile.alpine
      tag_suffix: "-alpine"
    - dockerfile: Dockerfile.dockergen
      tag_suffix: "-dockergen"

steps:
  build-and-push:
    image: redpencil/plugin-docker-buildx:latest
    pull: true
    settings:
      repo: ${CI_REPO/redpencilio/redpencil}
      dockerfile: ${dockerfile}
      tags: "latest${tag_suffix}"
      platforms:
        - linux/amd64
        - linux/arm64
      build_args:
        - "NGINX_PROXY_VERSION=latest"
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      ssh_key:
        from_secret: ssh_key
when:
  - event: push
    branch: [master, main]
